<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" href="../fonts/m-plus-2-var.woff2" as="font" type="font/woff2" crossorigin>
  <title>作品一覧 | AniMood</title>
  <meta name="description" content="2025年秋〜2026年春の新作アニメ一覧(続編を除く)。">

  <!-- ページ描画前に保存済みテーマを適用する -->
  <script>
    (() => {
      const theme = localStorage.getItem("anidiag-theme") || "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="../css/style.css?v=47">
  <link rel="icon" href="../img/favicon.png?v=47">
</head>
<body data-page="list">

  <!-- ===== ヘッダー ===== -->
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="../html/index.html"><img src="../img/favicon.ico"></a>
      <div class="header-actions">
        <div class="search-box">
          <input id="search-input" type="search" placeholder="作品名・タグで検索" autocomplete="off">
          <button id="search-submit" class="search-submit" type="button" aria-label="検索結果を表示"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg></button>
          <div id="search-dropdown" class="search-dropdown"></div>
        </div>

        <!-- ===== テーマ切替 ===== -->
        <button
          id="theme-btn"
          class="theme-toggle"
          type="button"
          aria-label="ダークモードに切り替える"
          aria-pressed="false"
        >
          <!-- ライトモード用：Sun -->
          <svg
            class="theme-icon theme-icon-sun"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>

          <!-- ダークモード用：Moon-Star -->
          <svg
            class="theme-icon theme-icon-moon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            <path d="M19 3v4"></path>
            <path d="M21 5h-4"></path>
          </svg>
        </button>

        <!-- ハンバーガー -->
        <button id="menu-btn" class="icon-btn" aria-label="メニュー">☰</button>
      </div>
    </div>
  </header>

  <nav id="drawer" class="drawer" aria-label="サイトメニュー">
    <a class="drawer-link" data-page="home" href="../html/index.html">トップ</a>
    <a class="drawer-link" data-page="quiz" href="../html/quiz.html">気分診断</a>
    <a class="drawer-link" data-page="list" href="../html/list.html">作品一覧</a>
    <a class="drawer-link" data-page="favorites" href="../html/check.html">チェック作品一覧</a>
    <a class="drawer-link" data-page="random" href="../html/random.html">ランダム作品</a>
    <p class="drawer-note">2025年秋〜2026年夏までとその他の作品を収録しています。</p>
  </nav>
  <div id="drawer-overlay"></div>

  <main class="container">
    <div class="page-head">
      <h1>作品一覧</h1>
      <p>2025年秋〜2026年夏までとその他の作品を収録。画像を押すと詳細が開きます。<br>
        詳細からは作品に合わせた状態でチェックをつけたり、ジャンルやタグをクリックすることで検索できます。<br>
        作者が未履修の作品はタグやパラメータに誤りがある場合があります。</p>
    </div>

    <!-- 絞り込み(シーズン / ジャンル) -->
    <div class="filter-bar">
      <div id="season-tabs" class="tab-row"></div>
      <!-- 年もジャンルと同じドロップダウン式で選択できるようにする -->
      <select id="year-filter" aria-label="年で絞り込む"></select>
      <select id="genre-filter" aria-label="ジャンルで絞り込む"></select>
      <span class="count-text" id="work-count"></span>
    </div>

    <section class="list-area">
      <div id="work-grid" class="grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>AniMood — 今の気分に合うアニメを見つける診断サイト</p>
    <p>掲載している作品情報・画像の権利は各権利者に帰属します。各作品の詳細は公式サイトをご確認ください。</p>
  </footer>

  <script src="../js/data.js?v=47"></script>
  <script src="../js/common.js?v=47"></script>
  <script src="../js/list.js?v=47"></script>
</body>
</html>
