<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" href="https://cdn.jsdelivr.net/fontsource/fonts/m-plus-2:vf@latest/japanese-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

  <title>気分診断 | AniMood</title>
  <meta name="description" content="20の質問に答えて、今の気分に合う新作アニメを診断。">

  <!-- ページ描画前に保存済みテーマを適用する -->
  <script>
    (() => {
      const theme = localStorage.getItem("anidiag-theme") || "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="../css/style.css?v=45">
  <link rel="icon" href="../img/favicon.png?v=45">
</head>
<body data-page="quiz">

  <!-- ===== ヘッダー ===== -->
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="../html/index.html"><img src="../img/favicon.ico"></a>
      <div class="header-actions">
        <div class="search-box">
          <input id="search-input" type="search" placeholder="作品名・タグで検索" autocomplete="off">
          <button id="search-submit" class="search-submit" type="button" aria-label="検索結果を表示"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg></button>
          <div id="search-dropdown" class="search-dropdown"></div>
        </div>

        <!-- ===== テーマ切替 ===== -->
        <button
          id="theme-btn"
          class="theme-toggle"
          type="button"
          aria-label="ダークモードに切り替える"
          aria-pressed="false"
        >
          <!-- ライトモード用：Sun -->
          <svg
            class="theme-icon theme-icon-sun"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>

          <!-- ダークモード用：Moon-Star -->
          <svg
            class="theme-icon theme-icon-moon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            <path d="M19 3v4"></path>
            <path d="M21 5h-4"></path>
          </svg>
        </button>

        <!-- ハンバーガー -->
        <button id="menu-btn" class="icon-btn" aria-label="メニュー">☰</button>
      </div>
    </div>
  </header>

  <nav id="drawer" class="drawer" aria-label="サイトメニュー">
    <button id="drawer-close" class="drawer-close" type="button" aria-label="メニューを閉じる">×</button>
    <a class="drawer-link" data-page="home" href="../html/index.html">トップ</a>
    <a class="drawer-link" data-page="quiz" href="../html/quiz.html">気分診断</a>
    <a class="drawer-link" data-page="list" href="../html/list.html">作品一覧</a>
    <a class="drawer-link" data-page="favorites" href="../html/check.html">チェック作品一覧</a>
    <a class="drawer-link" data-page="random" href="../html/random.html">ランダム作品</a>
    <p class="drawer-note">2025年秋〜2026年夏までとその他の作品を収録しています。</p>
  </nav>
  <div id="drawer-overlay"></div>

  <!-- ===== 進捗バー(スクロールに追従) ===== -->
  <div class="progress-wrap">
    <div class="progress-inner">
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <span id="progress-text">0 / 20 問</span>
    </div>
  </div>

  <main>
    <!-- ===== 導入 ===== -->
    <div class="quiz-head">
      <h1>今の気分、診断します</h1>
      <p>全20問。このページをスクロールして、直感で答えてください。</p>
    </div>

    <!-- ===== 質問エリア(JSで全問を描画) ===== -->
    <div id="question-list" class="q-list"></div>

    <!-- ===== 診断ボタン ===== -->
    <div class="diagnose-area">
      <div class="diagnose-action-wrap">
        <button id="diagnose-btn" class="btn-grad" disabled>診断する</button>
        <button id="include-checked-toggle" class="include-checked-toggle is-on" type="button" aria-pressed="true">
          <span class="include-checked-icon" aria-hidden="true">✓</span>
          <span class="include-checked-copy"><strong>チェックした作品を含む</strong></span>
          <span class="include-checked-switch" aria-hidden="true"><i></i></span>
        </button>
      </div>
    </div>

    <!-- ===== 診断結果(診断後に表示) ===== -->
    <section id="result" class="result" hidden>
      <div class="result-head">
        <h2>今の観たい傾向</h2>
        <p id="trend-text"></p>
        <div id="trend-chips"></div>
      </div>

      <h2 class="page-head" style="padding:0 0 6px; text-align:center;">おすすめのアニメ 9作品</h2>
      <p class="result-note">画像を押すと詳細が開きます。</p>
      <div id="result-grid" class="grid"></div>

      <div class="result-actions">
        <button id="retry-btn" class="btn-ghost">もう一度診断する</button>
        <a class="btn-ghost" href="../html/list.html">作品一覧を見る</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>AniMood — 今の気分に合うアニメを見つける診断サイト</p>
    <p>掲載している作品情報・画像の権利は各権利者に帰属します。各作品の詳細は公式サイトをご確認ください。</p>
  </footer>

  <script src="../js/data.js?v=45"></script>
  <script src="../js/questions.js?v=45"></script>
  <script src="../js/common.js?v=45"></script>
  <script src="../js/quiz.js?v=45"></script>
</body>
</html>
