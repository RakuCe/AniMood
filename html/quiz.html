<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@400;500;700;800;900&display=swap">
  <link rel="stylesheet" href="https://fonts.bunny.net/css2?family=M+PLUS+2:wght@400;500;700;800;900&display=swap">

  <title>気分診断 | AniMood</title>
  <meta name="description" content="質問に答えるだけで、気分に合うアニメを提案する診断サイト『AniMood(アニムード)』の診断ページ。">

  
  <script>
    (() => {
      const theme = localStorage.getItem("anidiag-theme") || "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="../css/style.css?v=135">
  <link rel="icon" href="../img/favicon.png?v=135">
</head>
<body data-page="quiz">

  
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="../html/index.html"><img src="../img/favicon.ico"></a>
      <div class="header-actions">
        <div class="search-box">
          <input id="search-input" type="search" placeholder="作品名・タグで検索" autocomplete="off">
          <button id="search-clear" class="search-clear" type="button" hidden aria-label="検索を消す">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
          </button>
          <button id="search-submit" class="search-submit" type="button" aria-label="検索結果を表示"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg></button>
          <div id="search-dropdown" class="search-dropdown"></div>
        </div>

        
        <button
          id="theme-btn"
          class="theme-toggle"
          type="button"
          aria-label="ダークモードに切り替える"
          aria-pressed="false"
        >
          
          <svg
            class="theme-icon theme-icon-sun"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>

          
          <svg
            class="theme-icon theme-icon-moon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            <path d="M19 3v4"></path>
            <path d="M21 5h-4"></path>
          </svg>
        </button>

        
        <button id="menu-btn" class="icon-btn" aria-label="メニュー">☰</button>
      </div>
    </div>
  </header>

  <nav id="drawer" class="drawer" aria-label="サイトメニュー">
    <a class="drawer-link" data-page="home" href="../html/index.html">トップ</a>
    <a class="drawer-link" data-page="quiz" href="../html/quiz.html">気分診断</a>
    <a class="drawer-link" data-page="list" href="../html/list.html">作品一覧</a>
    <a class="drawer-link" data-page="favorites" href="../html/check.html">チェック作品一覧</a>
    <a class="drawer-link" data-page="random" href="../html/random.html">ランダム作品</a>
  </nav>
  <div id="drawer-overlay"></div>

  
  <div class="progress-wrap">
    <div class="progress-inner">
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <span id="progress-text">0 / 20 問</span>
    </div>
  </div>

  <main>
    
    <div class="quiz-head">
      <h1>今の気分、診断します</h1>
    </div>

    
    <div id="question-list" class="q-list"></div>

    
    <div class="diagnose-area">
      <div class="diagnose-action-wrap">
        <button id="diagnose-btn" class="btn-grad" disabled>診断する</button>
        <button id="include-checked-toggle" class="include-checked-toggle is-on" type="button" aria-pressed="true">
          <span class="include-checked-icon" aria-hidden="true">✓</span>
          <span class="include-checked-copy"><strong>チェックした作品を含む</strong></span>
          <span class="include-checked-switch" aria-hidden="true"><i></i></span>
        </button>
      </div>
    </div>

    
    <section id="result" class="result" hidden>
      <div class="result-head">
        <h2>今の観たい傾向</h2>
        <p id="trend-text"></p>
        <div id="trend-chips"></div>
      </div>

      <h2 class="page-head" style="padding:0 0 6px; text-align:center;">おすすめのアニメ 9作品</h2>
      <p class="result-note">画像を押すと詳細が開きます。</p>
      <div id="result-grid" class="grid"></div>

      <div class="result-actions">
        <button id="retry-btn" class="btn-grad">もう一度診断する</button>
        <a class="btn-grad" href="../html/list.html">作品一覧をみる</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>AniMood — 今の気分に合うアニメを見つける診断サイト</p>
    <p>作品情報・画像の権利は各権利者に帰属します。話数・評価は AniList のデータを参照しています。</p>
    <p>© 2026 Raku*C.</p>
  </footer>

  <script src="../js/data.js?v=135"></script>
  <script src="../js/questions.js?v=135"></script>
  <script src="../js/common.js?v=135"></script>
  <script src="../js/quiz.js?v=135"></script>
</body>
</html>
